# =============================================================================
# TMUX CONFIG — Mac + Ghostty
# =============================================================================

# Prefix
# -----------------------------------------------------------------------------
set -g prefix C-Space
set -g prefix2 C-b
bind C-Space send-prefix

# Reload config
bind q source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# =============================================================================
# GENERAL
# =============================================================================

# Ghostty-native terminal + true color
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,tmux-256color:RGB"
set -ag terminal-overrides ",xterm-ghostty:RGB"
set -ag terminal-overrides ",tmux-256color:RGB"
set -ga update-environment " COLORTERM"
set -g extended-keys on 
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
set -g aggressive-resize on
set -g detach-on-destroy off

# =============================================================================
# COPY MODE (Vi)
# =============================================================================

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"   # Mac clipboard
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# =============================================================================
# PANE CONTROLS
# =============================================================================

bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind x kill-pane

# Navigate panes
# NOTE: C-M-Arrow conflicts with macOS Mission Control by default.
# Disable those shortcuts in: System Settings → Keyboard → Keyboard Shortcuts → Mission Control
bind -n C-M-Left  select-pane -L
bind -n C-M-Right select-pane -R
bind -n C-M-Up    select-pane -U
bind -n C-M-Down  select-pane -D
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Resize panes (Shift variants may not fire in all terminals — prefix fallbacks added)
bind -n C-M-S-Left  resize-pane -L 5
bind -n C-M-S-Down  resize-pane -D 5
bind -n C-M-S-Up    resize-pane -U 5
bind -n C-M-S-Right resize-pane -R 5
# Prefix fallbacks for resize (always reliable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# =============================================================================
# WINDOW NAVIGATION
# =============================================================================

bind r command-prompt -I "#W" "rename-window -- '%%'"
bind c new-window -c "#{pane_current_path}"
bind k confirm-before -p "kill-window #W? (y/n)" kill-window

# Alt+Number to jump to window (M-x = Option+x on Mac)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# =============================================================================
# SESSION CONTROLS
# =============================================================================

bind R command-prompt -I "#S" "rename-session -- '%%'"
bind C new-session -c "#{pane_current_path}"
bind K kill-session
bind P switch-client -p
bind N switch-client -n

# Gruvbox Material Dark Hard
thm_bg="#1d2021"
thm_surface="#282828"
thm_surface2="#3c3836"
thm_fg="#ddc7a1"
thm_muted="#928374"
thm_red="#ea6962"
thm_green="#a9b665"
thm_yellow="#d8a657"
thm_blue="#7daea3"
thm_magenta="#d3869b"
thm_cyan="#89b482"
thm_orange="#e78a4e"

# Status bar
set -g status "on"
set -g status-position top
set -g status-bg "${thm_bg}"
set -g status-justify "left"
set -g status-left-length "100"
set -g status-right-length "100"
set -g status-interval 5

# Messages
set -g message-style "fg=${thm_cyan},bg=${thm_surface2},align=centre"
set -g message-command-style "fg=${thm_cyan},bg=${thm_surface2},align=centre"

# Panes
set -g pane-border-style "fg=${thm_surface2}"
set -g pane-active-border-style "fg=${thm_blue}"

# Windows
set -g window-status-activity-style "fg=${thm_fg},bg=${thm_bg},none"
set -g window-status-bell-style "fg=${thm_bg},bg=${thm_red},bold"
set -g window-status-separator ""
set -g window-status-style "fg=${thm_fg},bg=${thm_bg},none"

# Statusline - current window
set -g window-status-current-format "#[fg=${thm_blue},bg=${thm_bg},nounderscore] #I: #[fg=${thm_magenta},bg=${thm_bg},nounderscore](✓) #[fg=${thm_cyan},bg=${thm_bg},nounderscore]#W #[fg=${thm_magenta},bg=${thm_bg},nounderscore]"

# Statusline - other windows
set -g window-status-format "#[fg=${thm_blue},bg=${thm_bg}] #I: #[fg=${thm_fg},bg=${thm_bg}]#W"

# Statusline - right side
set -g status-right "#[fg=${thm_blue},bg=${thm_bg},nobold,nounderscore,noitalics]#[fg=${thm_bg},bg=${thm_blue},nobold,nounderscore,noitalics] #[fg=${thm_fg},bg=${thm_surface2}] #W #{?client_prefix,#[fg=${thm_magenta}],#[fg=${thm_cyan}]}#[bg=${thm_surface2}]#{?client_prefix,#[bg=${thm_magenta}],#[bg=${thm_cyan}]}#[fg=${thm_bg}] #[fg=${thm_fg},bg=${thm_surface2}] #S "

# Statusline - left side (empty)
set -g status-left ""

# Modes
set -g clock-mode-colour "${thm_blue}"
set -g mode-style "fg=${thm_blue},bg=${thm_muted},bold"

# =============================================================================
# SESSION PERSISTENCE
# =============================================================================

set -g @resurrect-capture-pane-contents "on"
set -g @continuum-restore "on"
set -g @continuum-save-interval "15"

run-shell ~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux
run-shell ~/.config/tmux/plugins/tmux-continuum/continuum.tmux

# =============================================================================
# SESSIONIZER
# =============================================================================

set -g @sessionx-bind "f"
set -g @sessionx-preview-location "bottom"
set -g @sessionx-preview-ratio "50%"
set -g @sessionx-window-height "70%"
set -g @sessionx-window-width "70%"
set -g @sessionx-layout "reverse"
set -g @sessionx-fzf-builtin-tmux "on"

# vim-like navigation inside fzf
set -g @sessionx-bind-select-up "ctrl-k"
set -g @sessionx-bind-select-down "ctrl-j"

run-shell ~/.config/tmux/plugins/sessionx/sessionx.tmux
